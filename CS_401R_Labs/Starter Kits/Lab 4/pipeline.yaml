# NorthStar Retail — SageMaker Pipeline Definition
# CS 401R Lab 4 Starter Kit
#
# This CloudFormation template defines the NorthStar CI/CD infrastructure:
#   1. CodePipeline — orchestrates the full Source → Build → (Manual Approval) → Deploy flow
#   2. CodeBuild project — runs tests and triggers the SageMaker training pipeline
#   3. SageMaker Pipeline — defined separately via Python SDK (see pipeline_definition.py)
#
# Deploy this stack:
#   aws cloudformation deploy \
#     --template-file pipeline.yaml \
#     --stack-name northstar-cicd \
#     --parameter-overrides \
#         ProjectName=northstar \
#         Environment=dev \
#         GitHubOwner=YOUR_GITHUB_USERNAME \
#         GitHubRepo=northstar-ai-platform \
#         GitHubBranch=main \
#         ArtifactsBucket=northstar-dev-artifacts \
#     --capabilities CAPABILITY_IAM

AWSTemplateFormatVersion: "2010-09-09"
Description: NorthStar AI Platform - CI/CD Pipeline Stack

# ── Parameters ─────────────────────────────────────────────────────────────────

Parameters:
  ProjectName:
    Type: String
    Default: northstar
    Description: Project name - used as prefix for all resource names

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  GitHubOwner:
    Type: String
    Description: GitHub username or org that owns the repository
    # TODO: Set your GitHub username here

  GitHubRepo:
    Type: String
    Default: northstar-ai-platform
    Description: GitHub repository name

  GitHubBranch:
    Type: String
    Default: main

  ArtifactsBucket:
    Type: String
    Description: >-
      S3 bucket for CodePipeline's own stage artifacts. This is NOT the
      NorthStar data bucket. CodePipeline needs a working bucket of its own;
      the data bucket (northstar-dev-data-<account-id>) is referenced by the
      buildspec through prefixes and must not be reused here.

  SageMakerRoleArn:
    Type: String
    Description: >-
      MLEngineer role ARN from your Lab 1/2 Terraform output. Get it with:
        terraform -chdir=infrastructure/environments/dev output -raw ml_engineer_role_arn
      An earlier version of this template read it from SSM Parameter Store at
      /northstar/sagemaker-role-arn, but nothing in this course creates that
      parameter, so the stack failed at parameter resolution. Pass the ARN
      directly, or create the SSM parameter yourself and switch the type back.

  SageMakerPipelineName:
    Type: String
    Default: northstar-churn-pipeline

# ── Resources ──────────────────────────────────────────────────────────────────

Resources:

  # ── CodeBuild: IAM Role ─────────────────────────────────────────────────────

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
      Policies:
        - PolicyName: NorthStarCodeBuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-*"
              - Effect: Allow
                Action:
                  - sagemaker:StartPipelineExecution
                  - sagemaker:DescribePipelineExecution
                  - sagemaker:ListPipelineExecutionSteps
                Resource: !Sub "arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:pipeline/${SageMakerPipelineName}*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/northstar/*"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Ref SageMakerRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: sagemaker.amazonaws.com
              - Effect: Allow
                Action:
                  - codebuild:CreateReportGroup
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                Resource: !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/${ProjectName}-*"

  # ── CodeBuild: Project ──────────────────────────────────────────────────────

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-ci"
      Description: NorthStar AI Platform CI - runs tests and triggers SageMaker pipeline
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: PIPELINE_NAME
            Value: !Ref SageMakerPipelineName
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          # Bucket names pulled from Parameter Store in buildspec.yml
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      TimeoutInMinutes: 90
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/aws/codebuild/${ProjectName}-ci"

  # ── CodePipeline: IAM Role ──────────────────────────────────────────────────

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codepipeline-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: NorthStarPipelinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${ArtifactsBucket}/*"
              - Effect: Allow
                Action:
                  - s3:GetBucketVersioning
                Resource: !Sub "arn:aws:s3:::${ArtifactsBucket}"
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt CodeBuildProject.Arn
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref GitHubConnection

  # ── GitHub Connection (CodeStar) ────────────────────────────────────────────
  # After deploying this stack, you must manually complete the connection in the
  # AWS Console: Developer Tools → Settings → Connections → Activate

  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Sub "${ProjectName}-github"
      ProviderType: GitHub

  # ── CodePipeline ────────────────────────────────────────────────────────────

  NorthStarPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-pipeline"
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket

      Stages:

        # Stage 1: Source — pull from GitHub on push to main
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Sub "${GitHubOwner}/${GitHubRepo}"
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: true
              OutputArtifacts:
                - Name: SourceArtifact

        # Stage 2: Build — run tests and trigger SageMaker training pipeline
        - Name: Build
          Actions:
            - Name: RunTestsAndTrain
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1

        # Stage 3: Manual Approval — required before model goes to production
        # A human must review the model metrics and approve before SageMaker
        # changes the model's approval status to "Approved"
        - Name: ManualApproval
          Actions:
            - Name: ReviewModelMetrics
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              Configuration:
                # TODO: Replace with your team's email subscription ARN
                NotificationArn: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-model-approvals"
                CustomData: |
                  Review model metrics before approving for production deployment.
                  Check: AUC-ROC ≥ 0.72, Precision@Top10 ≥ 0.40
                  Open SageMaker Model Registry to compare against champion model.
                ExternalEntityLink: !Sub "https://${AWS::Region}.console.aws.amazon.com/sagemaker/home?region=${AWS::Region}#/model-registry"
              RunOrder: 1

        # Stage 4: Deploy — update Model Registry status to Approved
        # This triggers the SageMaker endpoint update (canary deployment)
        # TODO: Implement this stage in Lab 5 (Deployment & Scaling)
        # - Name: Deploy
        #   Actions:
        #     - Name: UpdateModelApproval
        #       ActionTypeId:
        #         Category: Invoke
        #         Owner: AWS
        #         Provider: Lambda
        #         Version: "1"
        #       Configuration:
        #         FunctionName: !Ref ModelApprovalLambda
        #       InputArtifacts:
        #         - Name: BuildArtifact

# ── Outputs ────────────────────────────────────────────────────────────────────

Outputs:
  PipelineName:
    Value: !Ref NorthStarPipeline
    Description: CodePipeline name
    Export:
      Name: !Sub "${ProjectName}-pipeline-name"

  CodeBuildProjectName:
    Value: !Ref CodeBuildProject
    Description: CodeBuild project name
    Export:
      Name: !Sub "${ProjectName}-codebuild-project"

  GitHubConnectionArn:
    Value: !Ref GitHubConnection
    Description: |
      ⚠️  ACTION REQUIRED: Complete this GitHub connection in the AWS Console.
      Go to: Developer Tools → Settings → Connections → northstar-github → Activate
    Export:
      Name: !Sub "${ProjectName}-github-connection"
